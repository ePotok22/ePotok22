name: snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-raw.svg?color_snake=#ffd43b&color_dots=#2f2450,#4a2f6b,#7a3f8f,#b06cff,#ff8fab

      - name: Frame snake in 404.0 FM card
        run: mkdir -p site && python3 scripts/frame_snake.py dist/snake-raw.svg site/snake.svg

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
